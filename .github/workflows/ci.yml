# lint + test on every push and pull request; e2e only when started by hand (PRD §8).
# Jobs call the same make targets as local development. The runner needs Docker with compose v2
# and buildx, curl, python3 and coreutils `timeout` (all present on ubuntu-latest); Go comes from
# admin/go.mod. No secrets are used.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref supersedes the one in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admin/go.mod
          cache-dependency-path: admin/go.sum
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: admin/go.mod
          cache-dependency-path: admin/go.sum
      - run: make test

  # Manual only: starts a real NPM stack (both suites, one after the other). The scripts remove
  # their own containers, networks and volumes on exit.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make e2e
      # .odd-checks/ is a hidden directory, so it must be included explicitly.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: .odd-checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
