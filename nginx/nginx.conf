# backsoon main config: one worker (RNF-1). Server logic and logging are in conf.d/default.conf,
# rendered at start from default.conf.template.
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    autoindex off;
    sendfile on;
    keepalive_timeout 15s;

    include /etc/nginx/conf.d/*.conf;
}
