<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{REFRESH}}">
<meta name="robots" content="noindex">
<title>{{APP_NAME}} · Volvemos en breve</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; --muted: #4a4a4a; --link: #0b5cad; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --fg: #f2f2f2; --muted: #b8b8b8; --link: #8ab4f8; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  background: var(--bg);
  color: var(--fg);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { width: 100%; max-width: 32rem; text-align: center; }
.app { margin: 0 0 .5rem; color: var(--muted); font-size: 1.125rem; overflow-wrap: anywhere; }
h1 { margin: 0 0 1rem; font-size: 2rem; line-height: 1.2; }
.msg { margin: 0 0 1rem; overflow-wrap: anywhere; }
.auto { margin: 0 0 1.5rem; color: var(--muted); font-size: .9375rem; }
.retry a { color: var(--link); font-weight: 600; }
</style>
</head>
<body>
<main>
<p class="app"><span aria-hidden="true">{{ICON}}</span> {{APP_NAME}}</p>
<h1>Volvemos en breve</h1>
<p class="msg">{{MESSAGE}}</p>
<p class="auto">Esta página se actualiza sola cada {{REFRESH}} segundos.</p>
<p class="retry"><a href="">Reintentar ahora</a></p>
</main>
</body>
</html>
