# Global NPM proxy-host fallback. Install in /data/nginx/custom/server_proxy.conf,
# then run nginx -t and nginx -s reload in NPM. No per-host advanced config.
proxy_intercept_errors on;
# Edit only this list to leave legitimate application 503 responses untouched.
error_page 502 503 504 =503 @backsoon;
# Lets a failed fallback reach @backsoon_unavailable. The chain is fixed and cannot loop:
# server -> @backsoon -> @backsoon_unavailable, and each hop below has its own error_page list.
recursive_error_pages on;

location @backsoon {
    # Variable proxy_pass defers DNS lookup: NPM can start without backsoon. Its literal "/" URI
    # replaces the application URI toward backsoon only (the client URL is unchanged), so no
    # application path such as /healthz or /__backsoon reaches backsoon's own locations.
    set $backsoon_upstream http://backsoon:80/;
    proxy_pass $backsoon_upstream;
    proxy_intercept_errors off;
    # Fallback-only bounds (applications keep NPM's timeouts): one attempt, at most
    # 2 s resolving + 2 s connecting, then 5 s of inactivity per send/read.
    resolver_timeout 2s;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
    # Own list (replaces the inherited one): an unusable backsoon ends in NPM's generic 502.
    error_page 502 504 @backsoon_unavailable;
    proxy_set_header Host $host;
    proxy_set_header X-Backsoon-Target "$server:$port";
    # backsoon alone owns the maintenance response headers.
}

location @backsoon_unavailable {
    # Any own list replaces the inherited one, so this 502 cannot re-enter @backsoon.
    # 599 is never produced here; the entry only cuts inheritance.
    error_page 599 @backsoon_unavailable;
    return 502;
}
