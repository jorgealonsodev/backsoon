# backsoon production stack (single stack, e.g. Portainer). Build context is the repository root.
# Prerequisite: an external network that Nginx Proxy Manager is attached to, named "proxy" or
# whatever BACKSOON_PROXY_NETWORK says (e.g. an existing NPM network such as npm-nw).
# No published ports: NPM reaches backsoon and backsoon-admin through that network only.
# backsoon-admin (the panel) is optional for serving: backsoon never depends on it (RNF-4a).

x-backsoon-build: &backsoon-build
  context: .
  dockerfile: nginx/Dockerfile

services:
  # One-shot: seeds the provisional default.html into the pages volume, then exits. It never
  # overwrites an existing default.html, so redeploys keep whatever pages the volume holds.
  # It runs as root and is the first writer of the volume, so after seeding it hands the volume
  # to uid 65532, the panel's user: otherwise root-owned /pages, /pages/host and /pages/target
  # would stop the panel from publishing. backsoon (nginx) only needs to read: files are 0644.
  # The hand-over runs on every redeploy, which also repairs volumes created before the panel.
  backsoon-init:
    build: *backsoon-build
    image: backsoon:local
    container_name: backsoon-init
    entrypoint: ["sh", "-c"]
    command: ["sh /docker-entrypoint.d/45-backsoon-seed.sh && chown -R 65532:65532 /pages"]
    environment:
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
    volumes:
      - backsoon_pages:/pages
    network_mode: none
    restart: "no"

  backsoon:
    build: *backsoon-build
    image: backsoon:local
    container_name: backsoon
    restart: unless-stopped
    environment:
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
    volumes:
      - backsoon_pages:/pages:ro
    networks:
      - proxy
    depends_on:
      backsoon-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The management panel. Reach it through an NPM proxy host (e.g. backsoon.example.com ->
  # backsoon-admin:8080) with SSL; it publishes no ports. Credentials come from the stack's
  # variables (see env.example); without them the panel refuses to start.
  backsoon-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: backsoon-admin:local
    container_name: backsoon-admin
    restart: unless-stopped
    environment:
      BACKSOON_ADMIN_USER: ${BACKSOON_ADMIN_USER:-}
      BACKSOON_ADMIN_PASSWORD_HASH: ${BACKSOON_ADMIN_PASSWORD_HASH:-}
      BACKSOON_ADMIN_PASSWORD: ${BACKSOON_ADMIN_PASSWORD:-}
      BACKSOON_SESSION_SECRET: ${BACKSOON_SESSION_SECRET:-}
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
      BACKSOON_TRUSTED_PROXIES: ${BACKSOON_TRUSTED_PROXIES:-}
    volumes:
      - backsoon_pages:/pages
      - backsoon_meta:/meta
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backsoon-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/backsoon-admin", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: ${BACKSOON_PROXY_NETWORK:-proxy}

volumes:
  backsoon_pages:
    name: backsoon_pages
  backsoon_meta:
    name: backsoon_meta
