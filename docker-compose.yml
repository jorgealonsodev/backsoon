# backsoon production stack (single stack, e.g. Portainer). Build context is the repository root.
# Prerequisite: an external network that Nginx Proxy Manager is attached to, named "proxy" or
# whatever BACKSOON_PROXY_NETWORK says (e.g. an existing NPM network such as npm-nw).
# NPM reaches backsoon and backsoon-admin through that network. backsoon publishes no ports; the
# panel is also published on BACKSOON_ADMIN_HOST_BIND:BACKSOON_ADMIN_HOST_PORT (127.0.0.1:8181).
# backsoon-admin (the panel) is optional for serving: backsoon never depends on it (RNF-4a).

# Every service builds from this repository; pull_policy: build rebuilds on every deploy, so a
# redeploy picks up the checked-out sources instead of reusing an older local image.
x-backsoon-build: &backsoon-build
  context: .
  dockerfile: nginx/Dockerfile

services:
  # One-shot: seeds the provisional default.html into the pages volume, then exits. It never
  # overwrites an existing default.html, so redeploys keep whatever pages the volume holds.
  # It runs as root and is the first writer of the volume, so after seeding it hands the volume
  # to uid 65532, the panel's user: otherwise root-owned /pages, /pages/host and /pages/target
  # would stop the panel from publishing. backsoon (nginx) only needs to read: files are 0644.
  # The hand-over runs on every redeploy, which also repairs volumes created before the panel.
  backsoon-init:
    build: *backsoon-build
    image: backsoon:local
    pull_policy: build
    container_name: backsoon-init
    entrypoint: ["sh", "-c"]
    command: ["sh /docker-entrypoint.d/45-backsoon-seed.sh && chown -R 65532:65532 /pages"]
    environment:
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
    volumes:
      - backsoon_pages:/pages
    network_mode: none
    restart: "no"

  backsoon:
    build: *backsoon-build
    image: backsoon:local
    pull_policy: build
    container_name: backsoon
    restart: unless-stopped
    environment:
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
    volumes:
      - backsoon_pages:/pages:ro
    networks:
      - proxy
    depends_on:
      backsoon-init:
        condition: service_completed_successfully
      backsoon-npm-snippet:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # One-shot: copies the NPM fallback into NPM's custom directory (BACKSOON_NPM_CUSTOM_DIR, the
  # host path of NPM's /data/nginx/custom); unset, it installs nothing. Offline, read-only and
  # without capabilities. backsoon and the panel wait for it, so like an invalid BACKSOON_REFRESH a
  # refusal (a foreign server_proxy.conf, an invalid BACKSOON_NPM_INTERCEPT_503 or BACKSOON_NPM_RESTORE) stops the deploy
  # with its reason in `docker logs backsoon-npm-snippet`, and `up --wait` accepts its exit.
  # NPM applies the file at its next reload (saving any proxy host, or restarting NPM).
  # BACKSOON_NPM_RESTORE=true removes backsoon's file instead (NPM's default configuration).
  backsoon-npm-snippet:
    build: *backsoon-build
    image: backsoon:local
    pull_policy: build
    container_name: backsoon-npm-snippet
    entrypoint: ["/usr/local/bin/backsoon-npm-snippet"]
    environment:
      BACKSOON_NPM_CUSTOM_DIR: ${BACKSOON_NPM_CUSTOM_DIR:-}
      BACKSOON_NPM_INTERCEPT_503: ${BACKSOON_NPM_INTERCEPT_503:-true}
      BACKSOON_NPM_RESTORE: ${BACKSOON_NPM_RESTORE:-false}
    volumes:
      - ${BACKSOON_NPM_CUSTOM_DIR:-backsoon_npm_custom}:/npm-custom
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # The management panel. Reach it through an NPM proxy host with SSL, either by name
  # (backsoon.example.com -> backsoon-admin:8080) or through the published host port. Its session
  # cookie is Secure: plain http on the host port cannot sign in (except http://localhost).
  # Credentials come from the stack's variables (see env.example); without them it refuses to start.
  backsoon-admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: backsoon-admin:local
    pull_policy: build
    container_name: backsoon-admin
    restart: unless-stopped
    environment:
      BACKSOON_ADMIN_USER: ${BACKSOON_ADMIN_USER:-}
      BACKSOON_ADMIN_PASSWORD_HASH: ${BACKSOON_ADMIN_PASSWORD_HASH:-}
      BACKSOON_ADMIN_PASSWORD: ${BACKSOON_ADMIN_PASSWORD:-}
      BACKSOON_SESSION_SECRET: ${BACKSOON_SESSION_SECRET:-}
      BACKSOON_REFRESH: ${BACKSOON_REFRESH:-10}
      BACKSOON_TRUSTED_PROXIES: ${BACKSOON_TRUSTED_PROXIES:-}
    volumes:
      - backsoon_pages:/pages
      - backsoon_meta:/meta
    networks:
      - proxy
    ports:
      - "${BACKSOON_ADMIN_HOST_BIND:-127.0.0.1}:${BACKSOON_ADMIN_HOST_PORT:-8181}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backsoon-init:
        condition: service_completed_successfully
      backsoon-npm-snippet:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/backsoon-admin", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: ${BACKSOON_PROXY_NETWORK:-proxy}

volumes:
  backsoon_pages:
    name: backsoon_pages
  backsoon_meta:
    name: backsoon_meta
  # Placeholder for /npm-custom when BACKSOON_NPM_CUSTOM_DIR is unset; never read by NPM.
  backsoon_npm_custom:
    name: backsoon_npm_custom
