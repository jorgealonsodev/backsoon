# Test-only deterministic application: exercises original upstream status codes.
server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    server_tokens off;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 200 "fixture-app-ok\n"; }
    location = /502 {
        add_header Retry-After 321 always;
        add_header Cache-Control "public, max-age=321" always;
        add_header X-Backsoon upstream always;
        return 502 "fixture-upstream-502\n";
    }
    location = /503 {
        add_header Retry-After 321 always;
        add_header Cache-Control "public, max-age=321" always;
        add_header X-Backsoon upstream always;
        return 503 "fixture-upstream-503\n";
    }
    location = /504 {
        add_header Retry-After 321 always;
        add_header Cache-Control "public, max-age=321" always;
        add_header X-Backsoon upstream always;
        return 504 "fixture-upstream-504\n";
    }
}
